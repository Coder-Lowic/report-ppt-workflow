<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="-apple-system,'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/>
    </marker>
    <linearGradient id="gA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F59E0B"/><stop offset="1" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="gB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22C55E"/><stop offset="1" stop-color="#16A34A"/>
    </linearGradient>
    <linearGradient id="gZ" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1F3864"/><stop offset="1" stop-color="#0A7CFF"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="1198" height="558" rx="16" fill="#FFFFFF" stroke="#EAEEF2"/>

  <!-- 分组带:上行(规划) / 下行(撰写交付) -->
  <rect x="196" y="76" width="884" height="206" rx="14" fill="#FFF7E8"/>
  <rect x="196" y="336" width="664" height="206" rx="14" fill="#ECFDF3"/>
  <text x="214" y="64" font-size="13" font-weight="600" fill="#B45309">规划</text>
  <text x="214" y="324" font-size="13" font-weight="600" fill="#15803D">撰写与交付</text>

  <!-- 输入卡(上行) -->
  <rect x="40" y="110" width="130" height="138" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-dasharray="5 4" stroke-width="1.5"/>
  <text x="105" y="168" font-size="17" font-weight="700" fill="#334155" text-anchor="middle">📥 材料</text>
  <text x="105" y="196" font-size="13.5" fill="#64748B" text-anchor="middle">通知·台账·纪要</text>
  <text x="105" y="216" font-size="13.5" fill="#64748B" text-anchor="middle">照片·单位模板</text>

  <!-- 上行卡片 ①-④:x=210/440/670/900, w=190 h=150 y=104 -->
  <g>
    <rect x="210" y="104" width="190" height="150" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
    <circle cx="305" cy="104" r="14" fill="url(#gA)" stroke="#FFFFFF" stroke-width="2.5"/>
    <text x="305" y="109" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="305" y="168" font-size="17" font-weight="700" fill="#1E293B" text-anchor="middle">三问定向</text>
    <text x="305" y="198" font-size="13" fill="#64748B" text-anchor="middle">受众·主题·目的</text>
    <text x="305" y="222" font-size="12.5" fill="#8A96A8" text-anchor="middle">给谁看·讲什么·为啥讲</text>
  </g>
  <g>
    <rect x="440" y="104" width="190" height="150" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
    <circle cx="535" cy="104" r="14" fill="url(#gA)" stroke="#FFFFFF" stroke-width="2.5"/>
    <text x="535" y="109" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="535" y="168" font-size="17" font-weight="700" fill="#1E293B" text-anchor="middle">模板适配</text>
    <text x="535" y="198" font-size="13" fill="#64748B" text-anchor="middle">主题色·字体</text>
    <text x="535" y="222" font-size="12.5" fill="#8A96A8" text-anchor="middle">生成设计Token表</text>
  </g>
  <g>
    <rect x="670" y="104" width="190" height="150" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
    <circle cx="765" cy="104" r="14" fill="url(#gA)" stroke="#FFFFFF" stroke-width="2.5"/>
    <text x="765" y="109" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
    <text x="765" y="168" font-size="17" font-weight="700" fill="#1E293B" text-anchor="middle">整理资料</text>
    <text x="765" y="198" font-size="13" fill="#64748B" text-anchor="middle">框架+资料清单</text>
    <text x="765" y="222" font-size="12.5" fill="#8A96A8" text-anchor="middle">缺料自动标出</text>
  </g>
  <g>
    <rect x="900" y="104" width="190" height="150" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
    <circle cx="995" cy="104" r="14" fill="url(#gA)" stroke="#FFFFFF" stroke-width="2.5"/>
    <text x="995" y="109" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
    <text x="995" y="168" font-size="17" font-weight="700" fill="#1E293B" text-anchor="middle">定制大纲</text>
    <text x="995" y="198" font-size="13" fill="#64748B" text-anchor="middle">万能提示词公式</text>
    <text x="995" y="222" font-size="12.5" fill="#8A96A8" text-anchor="middle">角色+任务+细节+格式</text>
  </g>

  <!-- 下行卡片 ⑤-⑦:x=210/440/670 y=364 -->
  <g>
    <rect x="210" y="364" width="190" height="150" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
    <circle cx="305" cy="364" r="14" fill="url(#gB)" stroke="#FFFFFF" stroke-width="2.5"/>
    <text x="305" y="369" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
    <text x="305" y="428" font-size="17" font-weight="700" fill="#1E293B" text-anchor="middle">填充内容</text>
    <text x="305" y="458" font-size="13" fill="#64748B" text-anchor="middle">公文·金句·改写</text>
    <text x="305" y="482" font-size="12.5" fill="#8A96A8" text-anchor="middle">成果=目标+动作+结果+价值</text>
  </g>
  <g>
    <rect x="440" y="364" width="190" height="150" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
    <circle cx="535" cy="364" r="14" fill="url(#gB)" stroke="#FFFFFF" stroke-width="2.5"/>
    <text x="535" y="369" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
    <text x="535" y="428" font-size="17" font-weight="700" fill="#1E293B" text-anchor="middle">讲稿计时</text>
    <text x="535" y="458" font-size="13" fill="#64748B" text-anchor="middle">40–60秒/页</text>
    <text x="535" y="482" font-size="12.5" fill="#8A96A8" text-anchor="middle">写入PPT备注</text>
  </g>
  <g>
    <rect x="670" y="364" width="190" height="150" rx="12" fill="url(#gZ)"/>
    <circle cx="765" cy="364" r="14" fill="#FFFFFF" stroke="#1F3864" stroke-width="2.5"/>
    <text x="765" y="369" font-size="13" font-weight="700" fill="#1F3864" text-anchor="middle">7</text>
    <text x="765" y="428" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">生成交付</text>
    <text x="765" y="458" font-size="13" fill="#BFDBFE" text-anchor="middle">生成→渲染→验收</text>
    <text x="765" y="482" font-size="12" fill="#BFDBFE" text-anchor="middle">pptx / PDF / PNG</text>
  </g>

  <!-- 红线警示卡(右下,独立) -->
  <rect x="900" y="364" width="190" height="150" rx="12" fill="#FEF2F2" stroke="#DC2626" stroke-dasharray="5 4" stroke-width="1.5"/>
  <text x="995" y="412" font-size="16" font-weight="700" fill="#DC2626" text-anchor="middle">⚠ 红线</text>
  <text x="995" y="442" font-size="13.5" fill="#7F1D1D" text-anchor="middle">数字取自材料</text>
  <text x="995" y="464" font-size="13.5" fill="#7F1D1D" text-anchor="middle">留白待核</text>
  <text x="995" y="486" font-size="13.5" fill="#7F1D1D" text-anchor="middle">严禁编造</text>

  <!-- 箭头:上行横排 -->
  <line x1="172" y1="179" x2="206" y2="179" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="402" y1="179" x2="436" y2="179" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="632" y1="179" x2="666" y2="179" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="862" y1="179" x2="896" y2="179" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arr)"/>
  <!-- ④→⑤ 折线:④底中 下行 → 左移 → ⑤顶中 -->
  <path d="M 995 258 V 300 Q 995 310 985 310 L 315 310 Q 305 310 305 320 V 358" fill="none" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arr)"/>
  <!-- 下行横排 -->
  <line x1="402" y1="439" x2="436" y2="439" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="632" y1="439" x2="666" y2="439" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arr)"/>
</svg>
